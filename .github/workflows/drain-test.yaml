name: OSDC Drain Test servicecdd63c57642a4b6e9b975ddd1172f899
'on':
  pull_request:
    types:
    - opened
    - synchronize
permissions:
  contents: read
jobs:
  drain:
    if: ${{ !cancelled() && !failure() && github.event.action == 'opened' }}
    timeout-minutes: 100
    concurrency:
      group: osdc-service-cancel-cdd63c57642a4b6e9b975ddd1172f899
      cancel-in-progress: false
    name: Cancel drain and recover
    runs-on:
    - osdc-service-cdd63c57642a4b6e9b975ddd1172f899-drain
    steps:
    - name: Check dedicated Kind connection
      id: aws
      if: ${{ success() && !cancelled() }}
      run: just --justfile /root/drain-full-retest-20261027-203940/ci-infra-test/osdc/kind/justfile
        kind-drain-service-step prepare --output /root/drain-full-retest-20261027-203940/evidence/service-cancel-live
        --key cdd63c57642a4b6e9b975ddd1172f899
    - name: Run drain/undrain test
      id: drain
      if: ${{ success() && !cancelled() }}
      timeout-minutes: 60
      run: just --justfile /root/drain-full-retest-20261027-203940/ci-infra-test/osdc/kind/justfile
        kind-drain-service-step cancel --output /root/drain-full-retest-20261027-203940/evidence/service-cancel-live
        --key cdd63c57642a4b6e9b975ddd1172f899
      env:
        OSDC_DRAIN_TEST_LIVE: true
        OSDC_DRAIN_RECOVERY_FILE: ${{ runner.temp }}/osdc-drain-${{ github.run_id
          }}-${{ github.run_attempt }}.json
    - name: Resume and verify cluster runners
      id: restore
      if: ${{ always() && steps.aws.outcome == 'success' }}
      timeout-minutes: 11
      run: just --justfile /root/drain-full-retest-20261027-203940/ci-infra-test/osdc/kind/justfile
        kind-drain-service-step restore --output /root/drain-full-retest-20261027-203940/evidence/service-cancel-live
        --key cdd63c57642a4b6e9b975ddd1172f899
      env:
        OSDC_DRAIN_TEST_LIVE: true
        OSDC_DRAIN_RECOVERY_FILE: ${{ runner.temp }}/osdc-drain-${{ github.run_id
          }}-${{ github.run_attempt }}.json
  successor:
    name: Acquire released lock
    if: ${{ !cancelled() && github.event.action == 'synchronize' }}
    runs-on:
    - osdc-service-cdd63c57642a4b6e9b975ddd1172f899-next
    timeout-minutes: 5
    concurrency:
      group: osdc-service-cancel-cdd63c57642a4b6e9b975ddd1172f899
      cancel-in-progress: false
    steps:
    - name: Verify recovery precedes lock release
      run: just --justfile /root/drain-full-retest-20261027-203940/ci-infra-test/osdc/kind/justfile
        kind-drain-service-step successor --output /root/drain-full-retest-20261027-203940/evidence/service-cancel-live
        --key cdd63c57642a4b6e9b975ddd1172f899
