name: OSDC Service Cancel 13fb89b55525491594da7676e13fca63
'on':
  pull_request:
    types:
    - opened
    - synchronize
permissions:
  contents: read
jobs:
  drain:
    if: ${{ !cancelled() && !failure() && github.event.action == 'opened' }}
    timeout-minutes: 90
    concurrency:
      group: osdc-service-cancel-13fb89b55525491594da7676e13fca63
      cancel-in-progress: false
    name: Cancel drain and recover
    runs-on:
    - osdc-service-13fb89b55525491594da7676e13fca63-drain
    steps:
    - name: Check dedicated Kind connection
      id: aws
      if: ${{ success() && !cancelled() }}
      run: just --justfile /root/drain-service-cancel-20261022/ci-infra-test/osdc/kind/justfile
        kind-drain-service-step prepare --output /root/drain-service-cancel-20261022/ci-infra-test/osdc/kind/.state/acceptance-fixed
        --key 13fb89b55525491594da7676e13fca63
    - name: Run drain/undrain test
      id: drain
      if: ${{ success() && !cancelled() }}
      timeout-minutes: 60
      run: just --justfile /root/drain-service-cancel-20261022/ci-infra-test/osdc/kind/justfile
        kind-drain-service-step cancel --output /root/drain-service-cancel-20261022/ci-infra-test/osdc/kind/.state/acceptance-fixed
        --key 13fb89b55525491594da7676e13fca63
      env:
        OSDC_DRAIN_RECOVERY_FILE: ${{ runner.temp }}/osdc-drain-${{ github.run_id
          }}-${{ github.run_attempt }}.json
    - name: Resume and verify staging runners
      id: restore
      if: ${{ always() && steps.aws.outcome == 'success' }}
      timeout-minutes: 4
      env:
        OSDC_DRAIN_RECOVERY_FILE: ${{ runner.temp }}/osdc-drain-${{ github.run_id
          }}-${{ github.run_attempt }}.json
      run: just --justfile /root/drain-service-cancel-20261022/ci-infra-test/osdc/kind/justfile
        kind-drain-service-step restore --output /root/drain-service-cancel-20261022/ci-infra-test/osdc/kind/.state/acceptance-fixed
        --key 13fb89b55525491594da7676e13fca63
  successor:
    name: Acquire released lock
    if: ${{ !cancelled() && github.event.action == 'synchronize' }}
    runs-on:
    - osdc-service-13fb89b55525491594da7676e13fca63-next
    timeout-minutes: 5
    concurrency:
      group: osdc-service-cancel-13fb89b55525491594da7676e13fca63
      cancel-in-progress: false
    steps:
    - name: Verify recovery precedes lock release
      run: just --justfile /root/drain-service-cancel-20261022/ci-infra-test/osdc/kind/justfile
        kind-drain-service-step successor --output /root/drain-service-cancel-20261022/ci-infra-test/osdc/kind/.state/acceptance-fixed
        --key 13fb89b55525491594da7676e13fca63
