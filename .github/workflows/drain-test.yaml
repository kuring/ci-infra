name: OSDC Drain Test service4f77d3798d0a4ef68311560dc7fb8e15
'on':
  pull_request:
    types:
    - opened
    - synchronize
permissions:
  contents: read
jobs:
  drain:
    if: ${{ !cancelled() && !failure() && github.event.action == 'opened' }}
    timeout-minutes: 120
    concurrency:
      group: osdc-service-cancel-4f77d3798d0a4ef68311560dc7fb8e15
      cancel-in-progress: false
    name: Cancel drain and recover
    runs-on:
    - osdc-service-4f77d3798d0a4ef68311560dc7fb8e15-drain
    steps:
    - name: Check dedicated Kind connection
      id: aws
      if: ${{ success() && !cancelled() }}
      run: just --justfile /root/drain-fix-service-cancel-20261103/ci-infra-test/osdc/kind/justfile
        kind-drain-service-step prepare --output /root/drain-fix-service-cancel-20261103/live-service-cancel
        --key 4f77d3798d0a4ef68311560dc7fb8e15
    - name: Run drain/undrain test
      id: drain
      if: ${{ success() && !cancelled() }}
      timeout-minutes: 90
      run: just --justfile /root/drain-fix-service-cancel-20261103/ci-infra-test/osdc/kind/justfile
        kind-drain-service-step cancel --output /root/drain-fix-service-cancel-20261103/live-service-cancel
        --key 4f77d3798d0a4ef68311560dc7fb8e15
      env:
        CLUSTER: kind-local
        RECOVERY_FILE: ${{ runner.temp }}/osdc-drain-${{ github.run_id }}-${{ github.run_attempt
          }}.json
        OSDC_DRAIN_TEST_LIVE: true
        OSDC_DRAIN_RECOVERY_FILE: ${{ runner.temp }}/osdc-drain-${{ github.run_id
          }}-${{ github.run_attempt }}.json
    - name: Resume and verify cluster runners
      id: restore
      if: ${{ always() && steps.aws.outcome == 'success' }}
      timeout-minutes: 11
      run: just --justfile /root/drain-fix-service-cancel-20261103/ci-infra-test/osdc/kind/justfile
        kind-drain-service-step restore --output /root/drain-fix-service-cancel-20261103/live-service-cancel
        --key 4f77d3798d0a4ef68311560dc7fb8e15
      env:
        CLUSTER: kind-local
        RECOVERY_FILE: ${{ runner.temp }}/osdc-drain-${{ github.run_id }}-${{ github.run_attempt
          }}.json
        OSDC_DRAIN_TEST_LIVE: true
        OSDC_DRAIN_RECOVERY_FILE: ${{ runner.temp }}/osdc-drain-${{ github.run_id
          }}-${{ github.run_attempt }}.json
  successor:
    name: Acquire released lock
    if: ${{ !cancelled() && github.event.action == 'synchronize' }}
    runs-on:
    - osdc-service-4f77d3798d0a4ef68311560dc7fb8e15-next
    timeout-minutes: 5
    concurrency:
      group: osdc-service-cancel-4f77d3798d0a4ef68311560dc7fb8e15
      cancel-in-progress: false
    steps:
    - name: Verify recovery precedes lock release
      run: just --justfile /root/drain-fix-service-cancel-20261103/ci-infra-test/osdc/kind/justfile
        kind-drain-service-step successor --output /root/drain-fix-service-cancel-20261103/live-service-cancel
        --key 4f77d3798d0a4ef68311560dc7fb8e15
